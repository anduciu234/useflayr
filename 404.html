<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Flayr</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to Flayr to create AI-powered ad creative for TikTok and Meta.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #060608;
      --s3:      #111116;
      --s4:      #161620;
      --purple:  #7C6EE6;
      --purple-l:#B8B0F5;
      --white:   #F0EEF8;
      --muted:   rgba(240,238,248,0.55);
      --border:  rgba(240,238,248,0.08);
      --font-d:  'Bricolage Grotesque', sans-serif;
      --font-b:  'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-b);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; }
    .code {
      font-family: var(--font-d);
      font-size: clamp(64px, 14vw, 96px);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--purple-l);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-family: var(--font-d);
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--white);
      background: var(--s3);
      transition: border-color .2s;
    }
    a.btn:hover { border-color: rgba(124,110,230,0.4); }
    a.btn.primary { background: var(--purple); color: #060608; border-color: var(--purple); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for may have been moved or removed. Head back home or check out the blog for ad creative guides and comparisons.</p>
    <div class="actions">
      <a href="/" class="btn primary">Go home</a>
      <a href="/blog" class="btn">Visit the blog</a>
    </div>
  </div>
</body>
</html>
